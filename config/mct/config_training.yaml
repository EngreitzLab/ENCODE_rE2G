
# Input config
model_config: "config/mct/config_models.tsv"  # Replace with your own config/config_models.tsv
dataset_config: "config/mct/config_biosamples.tsv" # Replace with your own config/config_biosamples.tsv
run_feature_analysis: True # do you want to run feature analysis? 

# Output directory
results_dir: "results/2025_0606_train_on_heldout"
max_memory_allocation_mb: 250000 # for submiting jobs

# Reference files/params
gene_TSS500: "reference/CollapsedGeneBounds.hg38.TSS500bp.bed" # TSS reference file
chr_sizes: "reference/GRCh38_EBV.no_alt.chrom.sizes.tsv"
gene_classes: "resources/external_features/gene_promoter_class_RefSeqCurated.170308.bed.CollapsedGeneBounds.hg38.TSS500bp.tsv"
crispr_dataset: # corresponds to crispr_dataset column in model config
  training: "reference/EPCrisprBenchmark_ensemble_data_GRCh38.tsv.gz"
  validation: "/oak/stanford/groups/engreitz/Users/sheth/ENCODE_rE2G_main/2025_0227_CTCF_and_H3K27ac/results/2025_0516_fix_peak_sizes/categorized_pairs/validation_all.h3k27me3_quantile_50.ratio_quantile_35.h3k27ac_quantiles_60_90.WTC11_as_WTC11.tsv.gz"
  combined: "/oak/stanford/groups/engreitz/Users/sheth/ENCODE_rE2G_main/2025_0227_CTCF_and_H3K27ac/results/2025_0516_fix_peak_sizes/categorized_pairs/training_and_validation.h3k27me3_quantile_50.ratio_quantile_35.h3k27ac_quantiles_60_90.WTC11_as_WTC11.tsv.gz"
crispr_cell_types: # list of cell types in crispr data to use
  training: ["K562"]
  validation: ["K562", "Jurkat", "HCT116", "GM12878", "WTC11"]
  combined: ["K562", "Jurkat", "HCT116", "GM12878", "WTC11"] 

# list of features that are generated by default, referenced by their column names in source files;
reference_features: ["numTSSEnhGene", "distance", "activity_base", "TargetGenePromoterActivityQuantile",
  "numNearbyEnhancers", "sumNearbyEnhancers", "is_ubiquitous_uniform", "P2PromoterClass", "numCandidateEnhGene",
  "hic_contact_pl_scaled_adj", "ABC.Score", "ABC.Numerator", "ABC.Denominator", "normalized_dhs_prom", "normalized_dhs_enh",
  "normalized_atac_prom", "normalized_atac_enh", "normalized_h3k27ac_enh", "normalized_h3k27ac_prom"] 


# Model parameters
epsilon: .01
default_params: 
  'solver': 'lbfgs'
  'fit_intercept': True
  'penalty': None
  'max_iter': 1e8
  'class_weight': None
  'tol': 1e-4
  'warm_start': False
  'random_state': 0
  'verbose': True
  'n_jobs': 1

### INTERNAL USE ONLY
ABC_DIR_PATH: "ABC"
# e2g path to prepend to reference and script files
# Only relevant when using e2g as a submodule
E2G_DIR_PATH: "."
final_score_col: "E2G.Score"